name: Bug report
description: Report a reproducible software or scientific-result problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Do not upload confidential diffraction data or unpublished structures to a public issue.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: OASIS4.3-GUI-0.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected result
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction and log
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
    validations:
      required: true
